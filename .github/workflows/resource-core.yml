name: Resource Core Python
on:
  push:
    branches: [feature/resource-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/resource_core -v
      - run: python tools/resource_core/run_pilot.py --seconds 5 --output pilot.csv
      - run: python tools/resource_core/run_pilot.py --scenarios wake,critical_wake,two_phase,protected_walk,request_order,instant_repeat --seconds 30 --output targeted.csv
      - run: python tools/resource_core/run_pilot.py --seconds 5 --dt 0.025 --output pilot_dt025.csv
      - run: python tools/resource_core/run_pilot.py --seconds 5 --dt 0.1 --output pilot_dt100.csv
      - run: python tools/resource_core/sensitivity.py pilot.csv pilot_dt025.csv pilot_dt100.csv
      - run: python tools/resource_core/pareto.py pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: resource-core-pilot-v3
          path: |
            pilot*.csv
            targeted.csv
            sensitivity_v3.csv
            pareto_v3.csv
