name: Resource Core Python
on:
  push:
    branches: [feature/resource-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/resource_core -v
      - run: python tools/resource_core/run_pilot.py --seconds 1 --output pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: resource-core-smoke
          path: pilot.csv
